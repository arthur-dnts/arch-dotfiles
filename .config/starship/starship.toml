format = """
[ ╭](fg:white)\
[](fg:white)\
[󰣇 ](bg:white fg:black)\
[ ](fg:white bg:light_green)\
$directory\
[ ](fg:light_green bg:cyan)\
$git_branch\
$git_status\
[ ](fg:cyan)\
$fill\
$jobs $cmd_duration [](fg:blue)$time\
[](fg:dark_blue bg:blue)\
$python\
$c\
$nodejs\
$java\
$lua\
[ ](fg:dark_blue)\
$battery\
$line_break\
[ ╰](white)\
$character
"""

palette = "nord"
add_newline = true
scan_timeout = 50

[fill]
symbol = " "

[directory]
style = "fg:black bg:light_green"
format = "[$path]($style)"
truncation_length = 2
truncation_symbol = " /"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
style = "fg:black bg:cyan"
symbol = " "
format = "[$symbol$branch ]($style)"

[git_status]
style = "fg:black bg:cyan"
format = "[$all_status$ahead_behind ]($style)"

[jobs]
symbol = ""
style = "fg:red"
number_threshold = 1
format = "[ $symbol]($style)"

[cmd_duration]
min_time = 500
style = "white"
format = "[$duration]($style)"

[time]
disabled = false
style = "fg:black bg:blue"
format = "[$time ]($style)"
use_12hr = true
time_format = "   %I:%M %p"
utc_time_offset = "local"

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "

[[battery.display]]
threshold = 100
discharging_symbol = "󰁹 "
style = "green"

[[battery.display]]
threshold = 90
discharging_symbol = "󰂂 "
style = "green"

[[battery.display]]
threshold = 80
discharging_symbol = "󰂁 "
style = "green"

[[battery.display]]
threshold = 70
discharging_symbol = "󰂀 "
style = "green"

[[battery.display]]
threshold = 60
discharging_symbol = "󰁿 "
style = "green"

[[battery.display]]
threshold = 50
discharging_symbol = "󰁾 "
style = "yellow"

[[battery.display]]
threshold = 40
discharging_symbol = "󰁽 "
style = "yellow"

[[battery.display]]
threshold = 30
discharging_symbol = "󰁼 "
style = "yellow"

[[battery.display]]
threshold = 20
discharging_symbol = "󰁻 "
style = "red"

[[battery.display]]
threshold = 10
discharging_symbol = "󰁺 "
style = "red"

[character]
format = "$symbol "
error_symbol = "[](red)"
success_symbol = "[󰁔](white)"

[python]
style = "fg:black bg:dark_blue"
symbol = ""
pyenv_prefix = ""
format = "[ $symbol $virtualenv $version]($style)"

[c]
style = "fg:black bg:dark_blue"
symbol = ""
format = "[ $symbol $version]($style)"

[nodejs]
style = "fg:black bg:dark_blue"
symbol = "󰎙"
format = "[ $symbol $version]($style)"

[java]
style = "fg:black bg:dark_blue"
symbol = ""
format = "[ $symbol $version]($style)"

[lua]
style = "fg:black bg:dark_blue"
symbol = ""
format = "[ $symbol $version]($style)"

[palettes.nord]
black = "#2E3440"
red = "#BF616A"
green = "#A3BE8C"
yellow = "#EBCB8B"
blue = "#81A1C1"
magenta = "#B48EAD"
cyan = "#88C0D0"
white = "#E5E9F0"
dark_blue = "#5E81AC"
light_green = "#8FBCBB"
gray = "#4c566A"
