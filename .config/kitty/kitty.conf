# Font Configuration
font_size 12.5
font_family JetBrains Mono Nerd Font
bold_font true
italic_font auto
bold_italic_font auto

# Load default session
enabled_layouts splits

# Window Configuration
window_padding_width 8
window_padding_height 0
background_opacity 0.7
dynamic_background_opacity yes
background_blur 1
hide_window_decorations yes
confirm_os_window_close 0

# Tab bar configuration
tab_bar_edge bottom
tab_bar_min_tabs 2
tab_bar_style powerline
tab_bar_align left
active_tab_font_style bold
inactive_tab_font_style normal

# Audio Configuration
enable_audio_bell yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1
cursor_trail 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard
map ctrl+shift+v launch --location=vsplit
map ctrl+shift+h launch --location=hsplit
map ctrl+shift+w close_window
map ctrl+t new_tab
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+shift+equal set_background_opacity +0.1
map ctrl+0 change_font_size all 0
map ctrl+shift+minus set_background_opacity -0.1
map ctrl+shift+0 set_background_opacity 0.7
map ctrl+p previous_tab
map ctrl+n next_tab
map ctrl+left previous_window
map ctrl+right next_window
map alt+a move_window left
map alt+w move_window up
map alt+d move_window right
map alt+s move_window down
map ctrl+shift+left resize_window narrower
map ctrl+shift+up resize_window taller
map ctrl+shift+right resize_window wider
map ctrl+shift+down resize_window shorter

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Theme
include themes/everforest.conf

